<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="80%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="goldWing" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#fbbf24"/>
      <stop offset="90%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Fondo circular oscuro -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Mariposa Dorada de Macondo y Cassiopea -->
  <g transform="translate(32,32)" filter="url(#glow)">
    <!-- Ala Derecha -->
    <path d="M 0, -2 C 6, -14 18, -20 22, -10 C 24, -2 18, 8 10, 6 C 14, 12 12, 18 6, 18 C 2, 18 0, 10 0, 4 Z" fill="url(#goldWing)" stroke="#451a03" stroke-width="0.7"/>
    <!-- Ala Izquierda (Reflejada) -->
    <path d="M 0, -2 C -6, -14 -18, -20 -22, -10 C -24, -2 -18, 8 -10, 6 C -14, 12 -12, 18 -6, 18 C -2, 18 0, 10 0, 4 Z" fill="url(#goldWing)" stroke="#451a03" stroke-width="0.7"/>
    <!-- Cuerpo y Cabeza -->
    <path d="M -1.2, -12 Q 0, -14 1.2, -12 L 1, 12 Q 0, 14 -1, 12 Z" fill="#1c0c02"/>
    <circle cx="0" cy="-13" r="1.8" fill="#fbbf24"/>
    <!-- Antenas -->
    <path d="M -0.5, -14 Q -4, -20 -7, -19 M 0.5, -14 Q 4, -20 7, -19" fill="none" stroke="#fde047" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Destellos Estelares (Ibeji Gemelos / Cassiopea) -->
    <circle cx="-16" cy="-16" r="1.2" fill="#38bdf8"/>
    <circle cx="16" cy="-16" r="1.2" fill="#f472b6"/>
  </g>
</svg>
